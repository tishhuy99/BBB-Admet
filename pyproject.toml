[project]
name = "bbb"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0", "rdkit>=2025.3", "scikit-learn", "xgboost", "fastapi", "uvicorn", "pydantic"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
